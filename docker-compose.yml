services:
  api:
    build: .
    container_name: elyas_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://elyas:elyas_password@db:5432/elyas
      JWT_SECRET: CHANGE_ME_SUPER_SECRET
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    depends_on:
      - db
    volumes:
      - ./app:/app/app

  db:
    image: postgres:16
    container_name: elyas_db
    restart: always
    environment:
      POSTGRES_USER: elyas
      POSTGRES_PASSWORD: elyas_password
      POSTGRES_DB: elyas
    ports:
      - "5432:5432"
    volumes:
      - elyas_pgdata:/var/lib/postgresql/data

volumes:
  elyas_pgdata:
